version: '3.8'

services:
  checkin-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checkin-geoattend-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-geoattend-super-secret-production-key-2026}
    volumes:
      - checkin-data:/app/backend/data

volumes:
  checkin-data:
    name: checkin-persistent-storage
