version: '3.8'

services:
  librahub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: librahub-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-librahub-production-secret-key-2026}
    volumes:
      - librahub-data:/app/backend/data

volumes:
  librahub-data:
    name: librahub-sqlite-storage
